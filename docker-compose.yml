services:
  postgres:
    image: postgres:16-alpine
    container_name: product_catalog_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Product-Catalog}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Product-Catalog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: product_catalog_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product_catalog_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/Product-Catalog
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_123456}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CACHE_TTL_PRODUCT_LIST=60
      - CACHE_TTL_PRODUCT_DETAIL=60
      - CACHE_TTL_CATEGORY=1800
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_API_PREFIX=/api/v1
    container_name: product_catalog_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

volumes:
  postgres_data:
    name: product_catalog_postgres_data

networks:
  app_network:
    name: product_catalog_network
    driver: bridge
